[tool.poetry]
name = "upki-ra"
version = "0.1.5"
description = "uPKI Registration Authority Server"
readme = "README.md"
authors = ["uPKI Team <info@upki.example.com>"]
license = "MIT"
package-mode = true
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0.0"
pyzmq = ">=27.0.0,<28.0.0"
fastapi = "^0.141.0"
uvicorn = {extras = ["standard"], version = "^0.52.0"}
pydantic = "^2.13.0"
dnspython = "^2.8.0"  # For DNS-01 challenge validation
cryptography = "^50.0.1"  # For certificate operations
httpx = "^0.28.0"  # For HTTP-01 challenge async validation

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.16.0"
mypy = "^2.3.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
# Not imported directly: ca_server.py from a sibling upki-ca checkout is run as a
# subprocess by tests/test_100_bootstrap.py and needs these on PYTHONPATH/venv.
pyyaml = "^6.0.3"
tinydb = "^4.9.0"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = false
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[[mypy.overrides]]
module = "zmq.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
